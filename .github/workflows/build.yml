# language: YAML, file: .github/workflows/build.yml
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install NPM dependencies
        run: npm install
        
      - name: Add Android Platform
        run: npx cap add android
        
      - name: Overwrite MainActivity.java
        run: |
          mkdir -p android/app/src/main/java/com/cyberspaam/app/
          cp android-src/MainActivity.java android/app/src/main/java/com/cyberspaam/app/MainActivity.java
        
      - name: Sync Web Code to Android
        run: npx cap sync
        
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ═══════════════════════════════════════════════════════════════
      # এখানে আমাদের আপলোড করা keystore ফাইল দিয়ে APK সাইন করা হচ্ছে
      # ═══════════════════════════════════════════════════════════════
      - name: Sign APK with Custom Keystore
        run: |
          # Android SDK বিল্ড টুলসের পাথ খোঁজা
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          
          # APK সাইন করা
          $APKSIGNER sign --ks cyber.keystore --ks-pass pass:cyberspaam --key-pass pass:cyberspaam --ks-key-alias cyberkey --out app-signed.apk android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberSpaam-APK
          path: app-signed.apk
