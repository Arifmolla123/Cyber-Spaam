name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets --save-dev
        
      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          mkdir -p assets
          if [ -f "www/icon.png" ]; then
            cp www/icon.png assets/icon.png
          fi
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#0b0f19'
          else
            echo "⚠️ No icon.png found. Skipping icon generation."
          fi
        
      - name: Copy Java Files
        run: |
          mkdir -p android/app/src/main/java/com/cyberspaam/app/
          cp android-src/MainActivity.java android/app/src/main/java/com/cyberspaam/app/MainActivity.java
          cp android-src/WorkerService.java android/app/src/main/java/com/cyberspaam/app/WorkerService.java

      # ═══ নতুন স্টেপ: AndroidManifest.xml অটোমেটিক প্যাচ করা ═══
      - name: Patch AndroidManifest.xml
        run: |
          python3 -c '
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r") as f: c = f.read()
          
          # পারমিশন যোগ করা
          perms = """<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application"""
          c = c.replace("<application", perms)
          
          # সার্ভিস যোগ করা
          service = """    <service android:name=".WorkerService" android:foregroundServiceType="dataSync" />
          </application>"""
          c = c.replace("</application>", service)
          
          with open(p, "w") as f: f.write(c)
          '
        
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberSpaam-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
