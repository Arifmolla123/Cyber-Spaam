# language: YAML, file: .github/workflows/worker.yml
name: Cyber Spaam Worker

on:
  schedule:
    - cron: '*/10 * * * *' # প্রতি ১০ মিনিটে চেক করবে
  workflow_dispatch: # ম্যানুয়ালি চালানোর জন্য

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: npm install firebase-admin puppeteer puppeteer-extra puppeteer-extra-plugin-stealth axios
      
      - name: Run Attack Engine
        run: node spaam.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
