<!-- language: HTML, file: www/admin.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Cyber Spaam</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');
    :root { 
      --bg-color: #0b0f19; 
      --card-bg: #151f32; 
      --primary: #00ff41; 
      --primary-glow: rgba(0, 255, 65, 0.4); 
      --danger: #ff3333; 
      --text-main: #e2e8f0; 
      --text-muted: #94a3b8; 
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    .container { width: 100%; max-width: 500px; background: var(--card-bg); padding: 25px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-top: 20px; }
    .container.hidden { display: none !important; }
    
    h1 { font-size: 24px; color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
    h3 { color: #fff; font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    input { width: 100%; padding: 14px; margin-bottom: 12px; background: #0b0f19; border: 1px solid #334155; color: #fff; border-radius: 8px; outline: none; font-size: 14px; transition: all 0.3s; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 255, 65, 0.1); }
    
    button { width: 100%; padding: 14px; background: var(--primary); color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; text-transform: uppercase; transition: all 0.2s; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 4px 15px rgba(255, 51, 51, 0.2); }
    .btn-secondary { background: #334155; color: #fff; margin-top: 15px; }
    
    .box { background: #0f172a; border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
    
    /* সার্চ বার */
    #searchInput { border: 1px solid var(--primary); margin-bottom: 15px; }
    
    /* ইউজার কার্ড */
    .user-card { background: #151f32; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 3px solid var(--primary); border: 1px solid var(--border); border-left-width: 4px; }
    .user-card p { margin: 5px 0; color: var(--text-muted); font-size: 13px; word-break: break-all; }
    .user-card b { color: #fff; }
    .user-key { font-size: 11px; color: #64748b; font-family: monospace; }
    .points { color: #facc15; font-weight: bold; font-size: 16px; text-shadow: 0 0 10px rgba(250, 204, 21, 0.3); }
    
    .action-row { display: flex; gap: 8px; margin-top: 12px; }
    .action-row input { width: 80px; margin: 0; padding: 8px; }
    .btn-small { padding: 8px 12px; font-size: 12px; border-radius: 6px; width: auto; flex: 1; }
    .btn-delete { background: rgba(255, 51, 51, 0.1); color: var(--danger); border: 1px solid var(--danger); }
    
    #adminStatus { text-align: center; font-size: 14px; font-weight: 600; margin-top: 15px; min-height: 20px; }
  </style>
</head>
<body>

  <!-- ═══ LOGIN PANEL ═══ -->
  <div id="authPanel" class="container">
    <h1>ADMIN ACCESS</h1>
    <input type="password" id="adminPass" placeholder="Enter Admin Password">
    <button onclick="checkPassword()">Login</button>
    <p id="authStatus" style="color:var(--danger); font-size:14px; text-align:center; margin-top:10px;"></p>
    <button class="btn-secondary" onclick="goBack()">Back to App</button>
  </div>

  <!-- ═══ ADMIN PANEL ═══ -->
  <div id="adminPanel" class="container hidden">
    <h1>ADMIN CONTROL</h1>
    
    <!-- গ্লোবাল ক্লিয়ার বাটন -->
    <div class="box" style="border-color: rgba(255, 51, 51, 0.4);">
      <h3 style="color: var(--danger); border-bottom-color: rgba(255, 51, 51, 0.2);">Danger Zone</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Clear all attack histories (jobs) for all users from the database.</p>
      <button class="btn-danger" onclick="clearAllGlobalJobs()" id="btnClearGlobal">🗑️ Clear All Global Jobs</button>
    </div>

    <div class="box">
      <h3>Active Users (Botnet)</h3>
      <input type="text" id="searchInput" placeholder="🔍 Search by ID or Device Name..." onkeyup="filterUsers()">
      
      <div id="userList" style="max-height: 400px; overflow-y: auto;">
        <p style="color:var(--text-muted); text-align:center;">Loading users...</p>
      </div>
    </div>

    <div class="box">
      <h3>Add Account (Manual)</h3>
      <input type="text" id="manualEmail" placeholder="Facebook Email or Phone Number">
      <input type="password" id="manualPass" placeholder="Facebook Password">
      <button onclick="addManualAccount()">Add to Botnet</button>
    </div>

    <button class="btn-secondary" onclick="goBack()">Back to App</button>
    <div id="adminStatus"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, child, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC22mPef-Lsi4qqTMZwmQ2WlcUtSTCiIP0",
      authDomain: "cyber-spaam.firebaseapp.com",
      databaseURL: "https://cyber-spaam-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cyber-spaam",
      storageBucket: "cyber-spaam.firebasestorage.app",
      messagingSenderId: "180047004522",
      appId: "1:180047004522:web:470d5c50f2e333916d9b13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allUsersData = {};

    window.checkPassword = function() {
      const pass = document.getElementById('adminPass').value;
      if (pass === 'arif123') {
        document.getElementById('authPanel').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadUsers(); 
      } else {
        document.getElementById('authStatus').innerText = "❌ Wrong Password!";
      }
    }

    window.goBack = function() {
      window.location.href = "index.html"; 
    }

    async function loadUsers() {
      const userListDiv = document.getElementById('userList');
      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, 'users'));
        
        if (snapshot.exists()) {
          allUsersData = snapshot.val();
          renderUsers(allUsersData);
        } else {
          userListDiv.innerHTML = '<p style="color:var(--text-muted); text-align:center;">No users found.</p>';
        }
      } catch (error) {
        userListDiv.innerHTML = `<p style="color:var(--danger); text-align:center;">Error: ${error.message}</p>`;
      }
    }

    function renderUsers(users) {
      const userListDiv = document.getElementById('userList');
      userListDiv.innerHTML = ''; 

      if(Object.keys(users).length === 0){
         userListDiv.innerHTML = '<p style="color:var(--text-muted); text-align:center;">No matching users found.</p>';
         return;
      }

      for (const [key, data] of Object.entries(users)) {
        const deviceName = data.deviceName || "Unknown Device";
        const points = data.points || 0;

        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `
          <p class="user-key">ID: ${key}</p>
          <p><b>Device:</b> ${deviceName}</p>
          <p><b>Points:</b> <span class="points" id="points-${key}">${points}</span></p>
          <div class="action-row">
            <input type="number" id="input-${key}" placeholder="Amt">
            <button class="btn-small" onclick="addPoints('${key}')">Add Pts</button>
            <button class="btn-small btn-delete" onclick="deleteUser('${key}')">Delete</button>
          </div>
        `;
        userListDiv.appendChild(card);
      }
    }

    window.filterUsers = function() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filteredData = {};

      for (const [key, data] of Object.entries(allUsersData)) {
        const deviceName = (data.deviceName || "").toLowerCase();
        const userKey = key.toLowerCase();

        if (userKey.includes(searchTerm) || deviceName.includes(searchTerm)) {
          filteredData[key] = data;
        }
      }
      renderUsers(filteredData);
    }

    window.addPoints = async function(userKey) {
      const inputAmount = document.getElementById(`input-${userKey}`).value;
      const amount = parseInt(inputAmount);
      const status = document.getElementById('adminStatus');
      
      if (isNaN(amount) || amount === 0) {
        status.style.color = "var(--danger)";
        status.innerText = "❌ Please enter a valid number.";
        return;
      }

      try {
        const userRef = ref(db, `users/${userKey}`);
        const snapshot = await get(userRef);
        const currentPoints = snapshot.val().points || 0;
        const newPoints = currentPoints + amount;

        await update(userRef, { points: newPoints });
        
        allUsersData[userKey].points = newPoints;
        document.getElementById(`points-${userKey}`).innerText = newPoints;
        document.getElementById(`input-${userKey}`).value = ''; 
        
        status.style.color = "var(--primary)";
        status.innerText = `✅ Added ${amount} points. Total: ${newPoints}`;
        setTimeout(() => { status.innerText = ""; }, 3000); 
        
      } catch (error) {
        status.style.color = "var(--danger)";
        status.innerText = "❌ Error: " + error.message;
      }
    }

    window.deleteUser = async function(userKey) {
      if (confirm("Are you sure you want to delete this user?")) {
        try {
          await remove(ref(db, `users/${userKey}`));
          delete allUsersData[userKey];
          document.getElementById('searchInput').value = '';
          renderUsers(allUsersData); 
        } catch (e) { alert("Error deleting user: " + e.message); }
      }
    }

    window.addManualAccount = async function() {
      const email = document.getElementById('manualEmail').value.trim();
      const password = document.getElementById('manualPass').value.trim();
      const status = document.getElementById('adminStatus');
      
      if (!email || !password) {
        status.style.color = "var(--danger)";
        status.innerText = "❌ Please enter email and password";
        return;
      }

      try {
        const accRef = ref(db, 'accounts');
        await set(push(accRef), { 
          email: email, 
          password: password,
          type: "credentials",
          addedAt: Date.now(),
          fails: 0,
          status: 'fresh'
        });
        
        status.style.color = "var(--primary)";
        status.innerText = "✅ Account added to Botnet!";
        document.getElementById('manualEmail').value = '';
        document.getElementById('manualPass').value = '';
        setTimeout(() => { status.innerText = ""; }, 3000);
      } catch (e) {
        status.style.color = "var(--danger)";
        status.innerText = "❌ Error: " + e.message;
      }
    }

    // ═══ গ্লোবাল ক্লিয়ার ফাংশন ═══
    window.clearAllGlobalJobs = async function() {
      if (!confirm("⚠️ WARNING:\nThis will permanently delete ALL job histories for ALL users from the database.\n\nAre you sure?")) return;
      
      const btn = document.getElementById('btnClearGlobal');
      const status = document.getElementById('adminStatus');
      btn.innerText = "Clearing...";
      btn.disabled = true;

      try {
        // পুরো 'jobs' নোড ডিলিট করে দেওয়া হচ্ছে
        await remove(ref(db, 'jobs'));
        
        status.style.color = "var(--primary)";
        status.innerText = "✅ All global jobs cleared successfully!";
      } catch (e) {
        status.style.color = "var(--danger)";
        status.innerText = "❌ Error clearing jobs: " + e.message;
      } finally {
        btn.innerText = "🗑️ Clear All Global Jobs";
        btn.disabled = false;
        setTimeout(() => { status.innerText = ""; }, 4000);
      }
    }
  </script>
</body>
  </html>
