<!-- language: HTML, file: www/worker.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#0b0f19; color:#fff; font-family:sans-serif; text-align:center; padding-top:50px;">
  <h2>Cyber Spaam Engine</h2>
  <p id="status">Initializing...</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC22mPef-Lsi4qqTMZwmQ2WlcUtSTCiIP0",
      authDomain: "cyber-spaam.firebaseapp.com",
      databaseURL: "https://cyber-spaam-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cyber-spaam",
      storageBucket: "cyber-spaam.firebasestorage.app",
      messagingSenderId: "180047004522",
      appId: "1:180047004522:web:470d5c50f2e333916d9b13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const WORKER_ID = (localStorage.getItem('worker_id') ||= 'w_' + Math.random().toString(36).slice(2, 10));
    const COOLDOWN_MS = 3 * 60 * 1000; 
    const STAGGER_MAX_MS = 2 * 60 * 1000; 
    
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const statusText = document.getElementById('status');
    
    let busy = false;

    function log(msg) {
      statusText.innerText = msg;
      console.log(msg);
    }

    // ═══ নতুন: ফায়ারবেসে ডিবাগ লগ পাঠানোর ফাংশন ═══
    async function debugLog(msg) {
      try {
        await update(ref(db, `debug_logs/${WORKER_ID}`), { 
          msg: msg, 
          time: Date.now(),
          device: "Android App"
        });
      } catch(e) { console.error("Debug log failed:", e); }
    }

    async function finishResult(jobId, ok, errMsg = '') {
      log(`Finishing job ${jobId}: ${ok ? 'SUCCESS' : 'FAILED'}`);
      await debugLog(`Finishing ${jobId}: ${ok ? 'OK' : 'FAIL'}`);
      try {
        await update(ref(db, `jobs/${jobId}/signals/${WORKER_ID}`), { 
          ok: ok, 
          err: errMsg,
          finishedAt: Date.now() 
        });
        localStorage.setItem('last_report_at', String(Date.now()));

        const snap = await get(ref(db, 'jobs/' + jobId));
        const job = snap.val();
        if (!job) return;

        const signals = job.signals || {};
        const total = Object.keys(signals).length;
        const success = Object.values(signals).filter(s => s.ok === true).length;
        const expired = Date.now() > (job.expiresAt || 0);
        const target = job.targetSignals || 1;

        if ((total >= target || expired) && success > 0) {
          await update(ref(db, 'jobs/' + jobId), { status: 'completed', completedAt: Date.now(), successCount: success });
        } else if (expired) {
          await update(ref(db, 'jobs/' + jobId), { status: 'failed', completedAt: Date.now(), successCount: success });
        }
      } catch (e) {
        console.error("Finish result error:", e);
      }
    }

    async function tick() {
      if (busy) return;
      const last = parseInt(localStorage.getItem('last_report_at') || '0', 10);
      if (Date.now() - last < COOLDOWN_MS) {
        log("Cooling down... waiting.");
        return;
      }

      busy = true;
      try {
        log("Checking for jobs...");
        await debugLog("Checking for jobs...");
        
        const snap = await get(ref(db, 'jobs'));
        if (!snap.exists()) { busy = false; log("No jobs found."); return; }

        const candidates = Object.entries(snap.val())
          .filter(([k, j]) =>
            j.status === 'collecting' &&
            Date.now() < (j.expiresAt || 0) &&
            !(j.signals && j.signals[WORKER_ID])
          )
          .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

        if (candidates.length === 0) {
          busy = false; log("No pending jobs for me."); return;
        }

        const [jobId, job] = candidates[0];
        
        const res = await runTransaction(ref(db, `jobs/${jobId}/signals/${WORKER_ID}`), s => {
          if (s) return; 
          return { at: Date.now(), dev: localStorage.getItem('device') || '?' };
        });

        if (!res.committed || !res.snapshot.val()) {
          busy = false; return;
        }

        log(`Claimed job ${jobId}. Staggering...`);
        await debugLog(`Claimed ${jobId}. Staggering...`);
        
        const stagger = Math.floor(Math.random() * STAGGER_MAX_MS);
        await sleep(stagger);

        if (window.AndroidWorker && window.AndroidWorker.navigate) {
          log(`Navigating to: ${job.targetUrl}`);
          await debugLog(`Navigating to FB...`);
          window.AndroidWorker.navigate(job.targetUrl + '|' + jobId);
          return; 
        } else {
          log("Error: AndroidWorker bridge not found.");
          await debugLog("ERROR: Bridge NOT found.");
          await update(ref(db, `jobs/${jobId}/signals/${WORKER_ID}`), { ok: false, err: 'no_bridge', finishedAt: Date.now() });
        }
      } catch (e) {
        console.error(e);
        log("Error in tick: " + e.message);
        await debugLog("Error in tick: " + e.message);
      } finally {
        busy = false;
      }
    }

    (async () => {
      await debugLog("Worker Script Loaded.");
      
      const h = location.hash.slice(1);
      if (h) {
        // ফিক্স: কোলন (:) থাকলেও যাতে ভেঙে না যায়
        const firstColon = h.indexOf(':');
        const secondColon = h.indexOf(':', firstColon + 1);
        let jobId, ok, errMsg;
        
        if (secondColon !== -1) {
            jobId = h.substring(0, firstColon);
            ok = h.substring(firstColon + 1, secondColon) === '1';
            errMsg = h.substring(secondColon + 1); // বাকি সব এরর মেসেজ
        } else {
            jobId = h.substring(0, firstColon);
            ok = h.substring(firstColon + 1) === '1';
            errMsg = '';
        }
        
        history.replaceState(null, '', 'worker.html'); 
        
        busy = true;
        await finishResult(jobId, ok, errMsg);
        busy = false;
      }
      
      setTimeout(() => {
        if (window.AndroidWorker) debugLog("Bridge FOUND");
        else debugLog("Bridge NOT FOUND");
      }, 2000);

      setInterval(async () => {
        try {
          await update(ref(db, `workers/${WORKER_ID}`), { 
            lastSeen: Date.now(), 
            device: "Cyber Spaam Engine" 
          });
        } catch (e) {}
      }, 30000);

      log("Engine running.");
      setInterval(tick, 30000); 
      tick();
    })();
  </script>
</body>
</html>
