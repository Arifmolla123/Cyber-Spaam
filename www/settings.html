<!-- language: HTML, file: www/settings.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings - Cyber Spaam</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');
    :root { --bg-color: #0b0f19; --card-bg: #151f32; --primary: #00ff41; --primary-glow: rgba(0, 255, 65, 0.4); --danger: #ff3333; --text-main: #e2e8f0; --text-muted: #94a3b8; --nav-bg: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    .top-bar { background: var(--nav-bg); padding: 15px 20px; text-align: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 100; }
    .top-bar h1 { font-size: 22px; color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); letter-spacing: 2px; }
    
    .content-area { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 90px; }
    
    .card { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid #1e293b; margin-bottom: 20px; }
    
    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #1e293b; }
    .setting-item:last-child { border-bottom: none; }
    
    .setting-text h3 { font-size: 18px; color: #fff; margin-bottom: 4px; }
    .setting-text p { font-size: 12px; color: var(--text-muted); }
    
    /* টগল সুইচ ডিজাইন */
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }

    /* লগআউট বাটন */
    .logout-btn { width: 100%; padding: 16px; background: var(--danger); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3); }
    .logout-btn:active { transform: scale(0.97); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--nav-bg); border-top: 1px solid #1e293b; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; cursor: pointer; width: 20%; height: 100%; transition: all 0.2s; }
    .nav-item:hover, .nav-item.active { color: var(--primary); }
    .nav-icon { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>SETTINGS</h1>
  </div>

  <div class="content-area">
    <div class="card">
      <!-- মিউজিক অপশন -->
      <div class="setting-item">
        <div class="setting-text">
          <h3>Background Music</h3>
          <p>Play music automatically</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="musicToggle" onchange="toggleMusic()">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <button class="logout-btn" onclick="logout()">Disconnect / Switch Account</button>
    </div>
  </div>

      Settings
    </div>
  </div>

  <script>
    // পেজ লোড হওয়া মাত্র মিউজিক টগলের অবস্থা চেক করা
    window.onload = function() {
      const isMusicOn = localStorage.getItem('cyber_music') === 'on';
      document.getElementById('musicToggle').checked = isMusicOn;
    }

    // টগল করলে লোকাল স্টোরেজে সেভ করা
    function toggleMusic() {
      const isChecked = document.getElementById('musicToggle').checked;
      if (isChecked) {
        localStorage.setItem('cyber_music', 'on');
      } else {
        localStorage.setItem('cyber_music', 'off');
      }
    }

    function logout() {
      if (confirm("Switch Account?\n\nYour current account is SAVED in the database.")) {
        localStorage.removeItem('cyber_cookie');
        localStorage.removeItem('cyber_key');
        localStorage.removeItem('cached_points');
        localStorage.removeItem('cyber_history');
        window.location.replace("login.html"); 
      }
    }
  </script>
